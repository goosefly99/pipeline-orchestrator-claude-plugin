[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pipeline-orchestrator"
version = "1.0.1"
description = "Pipeline orchestrator MCP server — reads pipeline.toml, resolves the typed DAG, validates artifacts, manages run state, and coordinates research/debate/synth phases"
requires-python = ">=3.11"
authors = [{ name = "olive" }]
dependencies = [
    "mcp>=1.0,<2",
    "jsonschema[format-nongpl]",
    "structlog",
    "httpx",
]

[project.optional-dependencies]
pdf = ["pypdf"]

[dependency-groups]
dev = [
    "pytest",
    "mypy",
    "ruff",
]

[tool.uv]
# Runtime `uv run` must NOT sync the dev group (pytest/mypy/ruff): doing so
# rebuilds the venv and re-downloads dev tools on every MCP launch, blowing the
# 30s MCP startup timeout. Empty default-groups => `uv run` syncs prod deps only.
default-groups = []

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline_orchestrator"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests", "hooks"]

[[tool.mypy.overrides]]
module = ["pypdf.*", "jsonschema.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
src = ["src", "tests", "hooks"]
# The legacy-node/ Node tree (incl. its start.py + test_start_py.py) is out of
# the pure-Python port surface and excluded from the gate.
extend-exclude = ["legacy-node"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests", "hooks/tests"]
